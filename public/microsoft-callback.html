<!DOCTYPE html>
<!--
  Статическая страница-редирект для OAuth PKCE у Microsoft (OneDrive)
  — та же самая схема, что и у public/dropbox-callback.html, только
  под своим redirect_uri, потому что Azure требует регистрировать
  redirect URI под конкретным приложением (нельзя переиспользовать
  redirect_uri от Dropbox для Microsoft, даже если содержимое файла
  идентично). Скопируйте этот файл на СВОЙ домен (туда же, где
  работает редактор) и укажите его полный URL как redirect_uri:

    1. в регистрации приложения Azure (App registrations → ваше
       приложение → Authentication → Single-page application →
       Redirect URIs) — должен совпадать 1-в-1, включая протокол;
    2. в опциях OneDriveProvider на сайте (redirectUri).

  Платформа redirect URI в Azure — именно "Single-page application",
  не "Web": только у SPA-платформы включён CORS на /token endpoint,
  без чего fetch() из браузера до токена не достучится (см. README).

  Страница ничего не делает, кроме как передаёт code/state обратно
  в окно, которое её открыло, через postMessage, и закрывается.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Авторизация…</title>
</head>
<body>
  <p>Завершаем авторизацию…</p>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var payload = {
        source: 'grapesjs-cloud-assets-oauth',
        code: params.get('code') || undefined,
        state: params.get('state') || undefined,
        error: params.get('error_description') || params.get('error') || undefined
      };
      if (window.opener) {
        window.opener.postMessage(payload, window.location.origin);
      }
      window.close();
    })();
  </script>
</body>
</html>
